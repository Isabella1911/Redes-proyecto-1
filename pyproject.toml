[project]
name = "flora-assistant"
version = "0.1.0"
description = "Chatbot host (MCP) that identifies plants from photos and reports whether a species is native, introduced or invasive in a given country"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "mcp>=2.0.0",
    "python-dotenv>=1.0.0",
    # Starlette parses multipart form data (the web UI's photo upload) only
    # when this is installed; it is not pulled in by starlette itself.
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "starlette>=1.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
flora-assistant = "flora_assistant.main:run"
flora-assistant-web = "flora_assistant.web:run"
flora-mcp = "flora_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flora_assistant", "src/flora_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits the live GBIF API; skipped with -m 'not network'",
]
